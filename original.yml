    - data:
        code: "import json\nimport re\n\ndef main(arg1: str):\n    \"\"\"\n    清洗邮件数据\n\
          \    输入: arg1 - HTTP请求返回的JSON字符串\n    输出: result - 清洗后的邮件数据JSON字符串\n   \
          \ \"\"\"\n    \n    # 1. 解析输入数据\n    try:\n        if isinstance(arg1, bytes):\n\
          \            arg1 = arg1.decode(\"utf-8\")\n        data = json.loads(arg1)\
          \ if isinstance(arg1, str) else arg1\n    except Exception as e:\n     \
          \   return {\n            \"result\": json.dumps({\n                \"error\"\
          : f\"数据解析失败: {str(e)}\",\n                \"emails\": [],\n            \
          \    \"total\": 0\n            }, ensure_ascii=False)\n        }\n    \n\
          \    # 2. 获取邮件列表\n    items = data.get(\"items\", [])\n    if not items:\n\
          \        return {\n            \"result\": json.dumps({\n              \
          \  \"error\": \"没有邮件数据\",\n                \"emails\": [],\n           \
          \     \"total\": 0\n            }, ensure_ascii=False)\n        }\n    \n\
          \    # 3. 清洗每一封邮件\n    cleaned_emails = []\n    for email in items:\n  \
          \      # 提取候选人姓名\n        subject = email.get(\"subject\", \"\")\n     \
          \   name_match = re.search(r'([\\u4e00-\\u9fff]{2,4})[的]?(?:简历|求职)', subject)\n\
          \        candidate_name = name_match.group(1) if name_match else \"\"\n\
          \        \n        # 处理附件\n        attachments = email.get(\"attachments\"\
          , [])\n        attachment_list = []\n        for att in attachments:\n \
          \           if isinstance(att, dict):\n                attachment_list.append({\n\
          \                    \"filename\": att.get(\"filename\", \"\"),\n      \
          \              \"size\": att.get(\"size\", 0),\n                    \"download_url\"\
          : att.get(\"download_url\", \"\")\n                })\n        \n      \
          \  # 构建清洗后的邮件数据\n        cleaned_emails.append({\n            \"id\": email.get(\"\
          id\"),\n            \"message_id\": email.get(\"message_id\", \"\"),\n \
          \           \"sender\": email.get(\"sender\", \"\"),\n            \"sender_name\"\
          : email.get(\"sender_name\", \"\"),\n            \"subject\": subject,\n\
          \            \"candidate_name\": candidate_name,\n            \"has_attachments\"\
          : email.get(\"has_attachments\", False),\n            \"attachments\": attachment_list,\n\
          \            \"received_date\": email.get(\"received_date\", \"\"),\n  \
          \          \"category\": email.get(\"category\", \"\")\n        })\n   \
          \ \n    # 4. 统计信息\n    candidates = list(set([\n        e[\"candidate_name\"\
          ] for e in cleaned_emails \n        if e[\"candidate_name\"]\n    ]))\n\
          \    \n    result_data = {\n        \"emails\": cleaned_emails,\n      \
          \  \"total\": len(cleaned_emails),\n        \"with_attachments\": sum(1\
          \ for e in cleaned_emails if e[\"has_attachments\"]),\n        \"candidates\"\
          : candidates,\n        \"candidate_count\": len(candidates)\n    }\n   \
          \ \n    # 5. 返回结果\n    return {\n        \"result\": json.dumps(result_data,\
          \ ensure_ascii=False)\n    }"
