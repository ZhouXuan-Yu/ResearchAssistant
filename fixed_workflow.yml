    - data:
        code: "import json\nimport re\n\ndef main(jd_text: str) -> dict:\n    text\
          \ = (jd_text or \"\").strip()\n    text = re.sub(r\"^```(?:json)?\\s*\"\
          , \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"\\s*```$\", \"\"\
          , text)\n\n    try:\n        data = json.loads(text)\n    except Exception:\n\
          \        data = {\n            \"title\": \"\",\n            \"requirements\"\
          : [],\n            \"nice_to_have\": [],\n            \"full_jd_text\":\
          \ text,\n        }\n\n    return {\n        \"result\": json.dumps(data,\
          \ ensure_ascii=False),\n        \"full_jd_text\": data.get(\"full_jd_text\"\
          ) or \"\",\n        \"jd_title\": data.get(\"title\") or \"\",\n    }"
        code_language: python3
