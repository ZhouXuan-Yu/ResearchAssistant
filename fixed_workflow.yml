    - data:
        code: "import json\nimport re\n\ndef _parse_llm(text: str) -> dict | None:\n\
          \    if not text:\n        return None\n    t = text.strip()\n    t = re.sub(r\"\
          ^```(?:json)?\\s*\", \"\", t, flags=re.I)\n    t = re.sub(r\"\\s*```$\"\
          , \"\", t)\n    try:\n        return json.loads(t)\n    except Exception:\n\
          \        return {\"name\": \"\", \"match_score\": 0, \"tier\": \"未知\", \"\
          match_reason\": t[:300], \"key_points\": [], \"summary_50\": \"\"}\n\ndef\
          \ main(match_outputs: list, review_list: list, crawl_body: str, full_jd_text:\
          \ str, jd_title: str, normal_count: int) -> dict:\n    parsed = []\n   \
          \ for raw in (match_outputs or []):\n        p = _parse_llm(raw)\n     \
          \   if p:\n            parsed.append(p)\n    parsed.sort(key=lambda x: x.get(\"\
          match_score\") or 0, reverse=True)\n\n    tier1, tier2, tier3 = [], [],\
          \ []\n    for p in parsed:\n        score = p.get(\"match_score\") or 0\n\
          \        tier = str(p.get(\"tier\") or \"\")\n        if score >= 80 or\
          \ \"推荐\" in tier:\n            tier1.append(p)\n        elif score >= 60\
          \ or \"待定\" in tier:\n            tier2.append(p)\n        else:\n     \
          \       tier3.append(p)\n\n    try:\n        crawl = json.loads(crawl_body)\
          \ if crawl_body else {}\n    except Exception:\n        crawl = {}\n\n \
          \   lines = [\"# \U0001F4CB 简历初筛报告\", \"\"]\n    lines.append(f\"**岗位**：{jd_title\
          \ or '（见下方）'}\")\n    lines.append(f\"**本轮评分**：{len(parsed)} 人 | **进入匹配池**：{normal_count}\
          \ 人\")\n    lines.append(\"\")\n\n    if crawl:\n        lines.append(\"\
          ## \U0001F4EC 拉信摘要\")\n        lines.append(f\"- 处理邮件：{crawl.get('emails_processed',\
          \ '?')} 封\")\n        lines.append(f\"- 本轮新解析：{crawl.get('parsed', '?')}\
          \ 份（0 表示沿用历史解析结果）\")\n        lines.append(f\"- 同步人才库：{crawl.get('candidates_synced',\
          \ '?')} 人\")\n        errs = crawl.get('errors') or []\n        if errs:\n\
          \            lines.append(f\"- ⚠️ 附件下载失败：{len(errs)} 条（QQ超大附件需Cookie或手动上传）\"\
          )\n        lines.append(\"\")\n\n    jd = (full_jd_text or \"\").strip()\n\
          \    if jd:\n        lines.append(\"## \U0001F4CC 岗位要求\")\n        lines.append(jd[:600])\n\
          \        lines.append(\"\")\n\n    def block(title: str, rows: list, icon:\
          \ str):\n        if not rows:\n            return\n        lines.append(f\"\
          ## {icon} {title}（{len(rows)} 人）\")\n        lines.append(\"\")\n      \
          \  for i, p in enumerate(rows, 1):\n            name = p.get(\"name\") or\
