    - data:
        code: "import json\n\nJUNK_NAMES = {\"这里退订\", \"官方实习\", \"考试大纲\", \"智联招聘\"\
          , \"HarmonyOS\"}\n\ndef main(candidates_body: str) -> dict:\n    try:\n\
          \        data = json.loads(candidates_body) if candidates_body else {}\n\
          \    except Exception:\n        data = {}\n\n    items = data.get(\"items\"\
          ) or []\n    normal = []\n    review = []\n\n    for c in items:\n     \
          \   name = (c.get(\"name\") or \"\").strip()\n        phone = (c.get(\"\
          phone\") or \"\").strip()\n        raw_text = (c.get(\"raw_text\") or \"\
          \").strip()\n        confidence = c.get(\"confidence\") or 0\n\n       \
          \ is_junk = (name in JUNK_NAMES) or (\"退订\" in name)\n        has_content\
          \ = len(raw_text) > 80 or bool(phone)\n        is_resume = has_content and\
          \ confidence >= 0.25 and not is_junk\n\n        if is_resume:\n        \
          \    entry = dict(c)\n            entry[\"raw_text_short\"] = raw_text[:2500]\n\
          \            normal.append(entry)\n        else:\n            reason = \"\
          解析置信度低或内容不足，需人工复核\"\n            if is_junk:\n                reason = \"\
          疑似营销邮件\"\n            elif not raw_text:\n                reason = \"QQ超大附件未下载或PDF解析失败\"\
          \n            review.append({\n                \"id\": c.get(\"id\"),\n\
          \                \"name\": name or \"未知\",\n                \"reason\":\
          \ reason,\n            })\n\n    normal = normal[:10]\n    review = review[:20]\n\
          \n    return {\n        \"normal_list\": normal,\n        \"review_list\"\
          : review,\n        \"normal_count\": len(normal),\n        \"review_count\"\
          : len(review),\n    }"
