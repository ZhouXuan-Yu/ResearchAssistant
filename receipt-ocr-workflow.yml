        isInLoop: false
      id: edge-vat-llm
      selected: false
      source: code-vat
      sourceHandle: source
      target: llm-fallback
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
        isInLoop: false
      id: edge-llm-end
      selected: false
      source: llm-fallback
      sourceHandle: source
      target: end-vat
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
        isInLoop: false
      id: edge-receipt-end
      selected: false
      source: code-receipt
      sourceHandle: source
      target: end-receipt
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
        isInLoop: false
      id: edge-transport-end
      selected: false
      source: code-transport
      sourceHandle: source
      target: end-transport
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
        isInLoop: false
      id: edge-general-end
      selected: false
      source: code-general
      sourceHandle: source
      target: end-general
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: end
        isInLoop: false
      id: edge-fail-end
      selected: false
