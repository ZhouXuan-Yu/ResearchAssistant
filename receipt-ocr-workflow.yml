app:
  description: 接收票据图片，通过 Docker OCR 微服务识别并提取结构化字段（金额/日期/商户名称/行项目），支持正则提取与 LLM 兜底。多分支处理不同票据类型，具备异常处理与置信度评估。
  icon: 📄
  icon_background: '#FFD93D'
  mode: workflow
  name: 票据识别智能助手
  use_icon_as_answer_icon: false
  icon_type: emoji
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: OCR 服务地址
    id: ocr_base_url
    name: OCR_BASE_URL
    value: http://host.docker.internal:8001
    value_type: string
  - description: LLM 模型
    id: llm_model
    name: LLM_MODEL
    value: qwen3.5-35b
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .jpg
      - .jpeg
      - .png
      - .bmp
      - .webp
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 1
        file_size_limit: 20
        image_file_size_limit: 20
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 1
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 1
    opening_statement: 请上传您的票据图片（增值税发票/小票/收据/火车票/的士票），系统将自动识别关键信息。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - data:
        desc: 用户上传票据图片
        selected: false
        title: 开始
        type: start
        variables:
        - allowed_file_extensions:
          - .jpg
          - .jpeg
          - .png
          - .bmp
          - .webp
          allowed_file_types:
          - image
          allowed_file_upload_methods:
          - local_file
          - remote_url
          label: 票据图片
          max_length: 48
          options: []
          required: true
          type: file
          variable: receipt_image
          hint: ''
          default: ''
          placeholder: ''
      height: 90
      id: start-node
      position:
        x: 30
        y: 300
      positionAbsolute:
        x: 30
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - key: file
            type: file
            value: '{{#start-node.receipt_image#}}'
            value_type: file
          type: form-data
        desc: 调用 OCR Docker 服务识别票据文字
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 2000
        selected: false
        timeout:
          connect: 15
          max_connect_timeout: 0
          max_read_timeout: 0
          read: 60
        title: OCR识别
        type: http-request
        url: '{{#env.OCR_BASE_URL#}}/api/extract'
      height: 96
      id: http-ocr
      position:
        x: 350
        y: 300
      positionAbsolute:
        x: 350
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - conditions:
          - comparison_operator: '='
            id: cond-ok
            value: 'true'
            varType: string
            variable_selector:
            - http-ocr
            - body
            - success
            value_type: string
          id: case-success
          logical_operator: and
          title: 识别成功
        - conditions:
          - comparison_operator: '='
            id: cond-fail
            value: 'false'
            varType: string
            variable_selector:
            - http-ocr
            - body
            - success
            value_type: string
          id: case-fail
          logical_operator: and
          title: 识别失败
        desc: 根据 OCR 结果判断是否成功
        selected: false
        title: 结果判断
        type: if-else
      height: 124
      id: if-result
      position:
        x: 670
        y: 300
      positionAbsolute:
        x: 670
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - conditions:
          - comparison_operator: contains
            id: cond-vat
            value: vat_invoice
            varType: string
            variable_selector:
            - http-ocr
            - body
            - receipt_type
            value_type: string
          id: case-vat
          logical_operator: and
          title: 增值税发票
        - conditions:
          - comparison_operator: contains
            id: cond-receipt
            value: receipt
            varType: string
            variable_selector:
            - http-ocr
            - body
            - receipt_type
            value_type: string
          id: case-receipt
          logical_operator: and
          title: 小票/收据
        - conditions:
          - comparison_operator: contains
            id: cond-transport
            value: train
            varType: string
            variable_selector:
            - http-ocr
            - body
            - receipt_type
            value_type: string
          id: case-transport
          logical_operator: and
          title: 交通票据
        - conditions:
          - comparison_operator: contains
            id: cond-general
            value: general
            varType: string
            variable_selector:
            - http-ocr
            - body
            - receipt_type
            value_type: string
          id: case-general
          logical_operator: and
          title: 通用票据
        desc: 根据票据类型路由到不同处理分支
        selected: false
        title: 票据类型路由
        type: if-else
      height: 164
      id: if-type
      position:
        x: 990
        y: 160
      positionAbsolute:
        x: 990
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
        desc: 对正则未命中的字段使用 LLM 二次提取
        memory:
          query_prompt_template: ''
          role_prefix:
            assistant_prefix: ''
            user_prefix: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.1
            max_tokens: 1024
          mode: chat
          name: qwen3.5-35b
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: '你是一个票据信息提取专家。请从以下 OCR 识别文本中提取关键字段。


            票据OCR文本：

            {{#http-ocr.body.raw_text#}}


            已通过规则提取到的部分字段：

            - 商户名称: {{#http-ocr.body.vendor_name#}}

            - 票据编号: {{#http-ocr.body.receipt_number#}}

            - 日期: {{#http-ocr.body.date#}}

            - 总金额: {{#http-ocr.body.total_amount#}}

            - 税额: {{#http-ocr.body.tax_amount#}}


            请补充以下未提取到的字段（如果能从文本中找到的话）：

            1. 商户名称（如果上面为空）

            2. 票据编号/发票号码

            3. 日期

            4. 商品/服务明细


            请以 JSON 格式输出：

            {"vendor_name": null, "receipt_number": null, "date": null, "items": []}

            '
        - role: user
          text: 请从上述OCR文本中提取补充字段。只输出JSON，不要其他内容。
        selected: false
        title: LLM兜底提取
        type: llm
        variables: []
        vision:
          enabled: false
      height: 96
      id: llm-fallback
      position:
        x: 1310
        y: 60
      positionAbsolute:
        x: 1310
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(ocr_data: dict, llm_fallback: dict = None) -> dict:\n    \"\
          \"\"\n    格式化增值税发票输出\n    \"\"\"\n    result = {\n        \"status\": \"\
          success\",\n        \"type\": \"增值税发票\",\n        \"vendor\": ocr_data.get(\"\
          vendor_name\") or (llm_fallback.get(\"vendor_name\") if llm_fallback else\
          \ None) or \"未知\",\n        \"invoice_number\": ocr_data.get(\"receipt_number\"\
          ) or (llm_fallback.get(\"receipt_number\") if llm_fallback else None) or\
          \ \"\",\n        \"date\": ocr_data.get(\"date\") or (llm_fallback.get(\"\
          date\") if llm_fallback else None) or \"\",\n        \"total\": ocr_data.get(\"\
          total_amount\"),\n        \"tax\": ocr_data.get(\"tax_amount\"),\n     \
          \   \"currency\": ocr_data.get(\"currency\", \"CNY\"),\n        \"items\"\
          : ocr_data.get(\"items\", []),\n        \"confidence\": round(ocr_data.get(\"\
          confidence\", 0) * 100, 1),\n        \"processing_time\": ocr_data.get(\"\
          processing_time\", 0),\n        \"warnings\": ocr_data.get(\"warnings\"\
          , []),\n        \"suggested_action\": \"请核对金额与发票原件是否一致\"\n    }\n    return\
          \ result\n"
        code_language: python3
        desc: 格式化增值税发票的识别结果
        outputs:
        - children: null
          name: status
          type: string
          value_type: string
        - children: null
          name: type
          type: string
          value_type: string
        - children: null
          name: vendor
          type: string
          value_type: string
        - children: null
          name: invoice_number
          type: string
          value_type: string
        - children: null
          name: date
          type: string
          value_type: string
        - children: null
          name: total
          type: number
          value_type: number
        - children: null
          name: tax
          type: number
          value_type: number
        - children: null
          name: confidence
          type: number
          value_type: number
        selected: false
        title: 格式化-增值税发票
        type: code
        variables:
        - value_selector:
          - http-ocr
          - body
          variable: ocr_data
          value_type: object
        - value_selector:
          - llm-fallback
          - text
          variable: llm_fallback
          value_type: object
      height: 52
      id: code-vat
      position:
        x: 990
        y: 60
      positionAbsolute:
        x: 990
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(ocr_data: dict) -> dict:\n    result = {\n        \"status\"\
          : \"success\",\n        \"type\": \"小票/收据\",\n        \"merchant\": ocr_data.get(\"\
          vendor_name\", \"未知商户\"),\n        \"date\": ocr_data.get(\"date\", \"\"\
          ),\n        \"total\": ocr_data.get(\"total_amount\"),\n        \"items\"\
          : ocr_data.get(\"items\", []),\n        \"confidence\": round(ocr_data.get(\"\
          confidence\", 0) * 100, 1),\n        \"note\": \"小票格式多样，建议人工复核金额\"\n   \
          \ }\n    return result\n"
        code_language: python3
        desc: 格式化小票的识别结果
        outputs:
        - children: null
          name: status
          type: string
          value_type: string
        - children: null
          name: type
          type: string
          value_type: string
        - children: null
          name: merchant
          type: string
          value_type: string
        - children: null
          name: total
          type: number
          value_type: number
        selected: false
        title: 格式化-小票
        type: code
        variables:
        - value_selector:
          - http-ocr
          - body
          variable: ocr_data
          value_type: object
      height: 52
      id: code-receipt
      position:
        x: 990
        y: 260
      positionAbsolute:
        x: 990
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(ocr_data: dict) -> dict:\n    result = {\n        \"status\"\
          : \"success\",\n        \"type\": \"交通票据\",\n        \"date\": ocr_data.get(\"\
          date\", \"\"),\n        \"total\": ocr_data.get(\"total_amount\"),\n   \
          \     \"raw_text\": ocr_data.get(\"raw_text\", \"\")[:200],\n        \"\
          note\": \"交通票据识别精度有限，请手工核对\"\n    }\n    return result\n"
        code_language: python3
        desc: 格式化交通票据的识别结果
        selected: false
        title: 格式化-交通票据
        type: code
        variables:
        - value_selector:
          - http-ocr
          - body
          variable: ocr_data
          value_type: object
      height: 52
      id: code-transport
      position:
        x: 990
        y: 430
      positionAbsolute:
        x: 990
        y: 430
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(ocr_data: dict) -> dict:\n    return {\n        \"status\"\
          : \"success\",\n        \"type\": \"通用票据\",\n        \"raw_text\": ocr_data.get(\"\
          raw_text\", \"\")[:300],\n        \"suggested_action\": \"未能精确识别票据类型，以下为OCR原始文本供参考\"\
          \n    }\n"
        code_language: python3
        desc: 通用票据的降级输出
        selected: false
        title: 格式化-通用
        type: code
        variables:
        - value_selector:
          - http-ocr
          - body
          variable: ocr_data
          value_type: object
      height: 52
      id: code-general
      position:
        x: 990
        y: 560
      positionAbsolute:
        x: 990
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "def main(http_response: dict) -> dict:\n    error_msg = \"OCR 识别失败\"\
          \n    status_code = 500\n    if http_response:\n        error_msg = http_response.get(\"\
          error\", str(http_response))\n        status_code = http_response.get(\"\
          status_code\", 500)\n    return {\n        \"status\": \"error\",\n    \
          \    \"message\": error_msg,\n        \"code\": status_code,\n        \"\
          suggestion\": \"请检查图片是否清晰、格式是否支持（JPG/PNG/BMP/WEBP）\"\n    }\n"
        code_language: python3
        desc: 处理 OCR 失败的情况
        selected: false
        title: 失败处理
        type: code
        variables:
        - value_selector:
          - http-ocr
          - body
          variable: http_response
          value_type: object
      height: 52
      id: code-fail
      position:
        x: 990
        y: 700
      positionAbsolute:
        x: 990
        y: 700
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 增值税发票最终输出
        outputs:
        - value_selector:
          - code-vat
          - status
          variable: status
          value_type: string
        - value_selector:
          - code-vat
          - type
          variable: receipt_type
          value_type: string
        - value_selector:
          - code-vat
          - vendor
          variable: vendor
          value_type: string
        - value_selector:
          - code-vat
          - total
          variable: total_amount
          value_type: number
        selected: false
        title: 结束-增值税
        type: end
      height: 90
      id: end-vat
      position:
        x: 1310
        y: 60
      positionAbsolute:
        x: 1310
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 小票最终输出
        outputs:
        - value_selector:
          - code-receipt
          - status
          variable: status
          value_type: string
        - value_selector:
          - code-receipt
          - type
          variable: receipt_type
          value_type: string
        selected: false
        title: 结束-小票
        type: end
      height: 90
      id: end-receipt
      position:
        x: 1310
        y: 260
      positionAbsolute:
        x: 1310
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 交通票据最终输出
        outputs:
        - value_selector:
          - code-transport
          - status
          variable: status
          value_type: string
        - value_selector:
          - code-transport
          - type
          variable: receipt_type
          value_type: string
        selected: false
        title: 结束-交通
        type: end
      height: 90
      id: end-transport
      position:
        x: 1310
        y: 430
      positionAbsolute:
        x: 1310
        y: 430
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 通用票据最终输出
        outputs:
        - value_selector:
          - code-general
          - status
          variable: status
          value_type: string
        - value_selector:
          - code-general
          - type
          variable: receipt_type
          value_type: string
        selected: false
        title: 结束-通用
        type: end
      height: 90
      id: end-general
      position:
        x: 1310
        y: 560
      positionAbsolute:
        x: 1310
        y: 560
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 失败最终输出
        outputs:
        - value_selector:
          - code-fail
          - status
          variable: status
          value_type: string
        - value_selector:
          - code-fail
          - message
          variable: error_message
          value_type: string
        selected: false
        title: 结束-失败
        type: end
      height: 90
      id: end-fail
      position:
        x: 1310
        y: 700
      positionAbsolute:
        x: 1310
        y: 700
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
        isInLoop: false
      id: edge-start-ocr
      selected: false
      source: start-node
      sourceHandle: source
      target: http-ocr
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: if-else
        isInLoop: false
      id: edge-ocr-if
      selected: false
      source: http-ocr
      sourceHandle: source
      target: if-result
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: if-else
        isInLoop: false
      id: edge-success-type
      selected: false
      source: if-result
      sourceHandle: case-success
      target: if-type
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: code
        isInLoop: false
      id: edge-fail-code
      selected: false
      source: if-result
      sourceHandle: case-fail
      target: code-fail
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: code
        isInLoop: false
      id: edge-vat-code
      selected: false
      source: if-type
      sourceHandle: case-vat
      target: code-vat
      targetHandle: target
