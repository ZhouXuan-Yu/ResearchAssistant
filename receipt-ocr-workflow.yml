      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: code
        isInLoop: false
      id: edge-transport-code
      selected: false
      source: if-type
      sourceHandle: case-transport
      target: code-transport
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: code
        isInLoop: false
      id: edge-general-code
      selected: false
      source: if-type
      sourceHandle: case-general
      target: code-general
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
